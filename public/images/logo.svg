<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E29E"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7828"/>
      <stop offset="100%" stop-color="#6E4812"/>
    </linearGradient>
    <linearGradient id="copperGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8754F"/>
      <stop offset="60%" stop-color="#E59B78"/>
      <stop offset="100%" stop-color="#F2D0C0"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#161011" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0E0A0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Luxury Background Circle -->
  <rect width="500" height="500" rx="40" fill="#0C090A"/>
  <circle cx="250" cy="250" r="230" fill="url(#ambientGlow)"/>
  
  <!-- Outer Concentric Filigree Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="205" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Subtle Musical Note / Svara Nodes along ring -->
  <circle cx="250" cy="35" r="3.5" fill="#D4AF37"/>
  <circle cx="250" cy="465" r="3.5" fill="#D4AF37"/>
  <circle cx="35" cy="250" r="3.5" fill="#D4AF37"/>
  <circle cx="465" cy="250" r="3.5" fill="#D4AF37"/>

  <!-- Stylized Monogram / Musical Emblem: Intertwined 'T' and G-Clef / Veena motif -->
  <g transform="translate(0, -10)" filter="url(#subtleGlow)">
    <!-- Swirling G-Clef loop harmonized with letter 'T' -->
    <!-- Clef Upper Loop & Crown Bar of T -->
    <path d="M165,135 C190,120 310,120 335,135 C345,140 335,152 320,150 C285,145 215,145 180,150 C165,152 155,140 165,135 Z" fill="url(#goldGradient)"/>
    
    <!-- Top ornamental gem / bindu -->
    <circle cx="250" cy="105" r="4.5" fill="#F5E29E"/>
    
    <!-- Main G-clef & T vertical stem descending gracefully -->
    <path d="M250,135 C250,165 240,225 210,250 C175,280 160,315 175,355 C190,390 235,405 270,385 C310,360 320,305 295,260 C280,230 250,205 250,150 C250,115 285,115 290,140 C295,165 270,185 250,185 C240,185 235,178 238,170 C242,160 262,158 260,145 C258,135 245,135 242,148 C238,168 258,195 275,195 C305,195 315,155 305,125 C290,85 230,88 232,155 C233,210 268,238 282,268 C302,308 290,350 255,372 C225,390 188,375 178,345 C168,312 185,282 215,255 C238,235 246,180 246,135 Z" fill="url(#goldGradient)"/>
    
    <!-- Elegant Lower Clef Swirl / Veena Resonator Curve -->
    <path d="M250,335 C250,395 240,430 215,430 C198,430 195,410 205,395 C215,380 230,385 230,395 C230,402 224,407 218,407 C215,407 214,403 216,399 C220,392 212,388 208,393 C202,400 205,418 218,418 C232,418 240,390 240,345 L240,285" fill="none" stroke="url(#copperGradient)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Rhythmic soundwave accent arcs flanking the center -->
    <path d="M140,220 C130,240 130,265 140,285" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M120,205 C105,235 105,275 120,305" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
    
    <path d="M360,220 C370,240 370,265 360,285" fill="none" stroke="url(#copperGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M380,205 C395,235 395,275 380,305" fill="none" stroke="url(#copperGradient)" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Typography: TEJANJALI & Subtitle -->
  <text x="250" y="445" font-family="'Playfair Display', 'Cinzel', serif" font-size="24" font-weight="600" letter-spacing="9" fill="#F5E29E" text-anchor="middle">TEJANJALI</text>
  <text x="250" y="468" font-family="'Montserrat', 'Cinzel', sans-serif" font-size="8.5" font-weight="500" letter-spacing="4.5" fill="#C8754F" text-anchor="middle">VOCALIST • COMPOSER • ARTIST</text>
</svg>
