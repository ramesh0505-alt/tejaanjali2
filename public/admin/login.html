<!DOCTYPE html>
<html class="h-full bg-[#171414]" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tejanjali | Artist Studio Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            espresso: { 950: '#120f0e', 900: '#171414', 850: '#1d1918', 800: '#211B19', 700: '#29211E', 600: '#3A302C', 500: '#524540' },
            terracotta: { 400: '#cb7159', 500: '#B75D45', 600: '#a24f38', 700: '#843d2a' },
            ivory: { 50: '#fcfaf7', 100: '#F2E9DC', 200: '#e1d4c2', 300: '#c5b59e', muted: '#B9AAA0' },
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Inter"', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
</script>
</head>
<body class="h-full font-sans text-ivory-100 bg-espresso-900 antialiased">
<div class="flex h-full min-h-screen">
    <!-- LEFT: Image Split -->
    <div class="hidden lg:flex lg:w-1/2 relative bg-espresso-950 items-center justify-center overflow-hidden">
        <img class="absolute inset-0 w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5LuMhSqFMv38dOKSC1-PbIiT8hRapuumBtBN_w6q5VNF-yjkcSPKj43GTwfimjmNkD2je6-0fyAoSKuwWsM-lYQoz4BXBuiaypZ5YUXlTrkGT9mijHJaX5ggr2juenwPTVY8x0wSeQC7zhKaQS55G1eDerDU_XuPIB7Khsuzsn99p-eCw5pqcixcWwF8xuA5IOyrFkyP3vgtyZJgzWO9fqVJlmzK_vhL0OE6lupPLejcbWuWvHp4J8GIZLbxVUEAjzQ8" alt="Tejanjali Performance">
        <div class="absolute inset-0 bg-gradient-to-t from-espresso-950 via-espresso-950/40 to-transparent"></div>
        <div class="relative z-10 text-center px-12">
            <h1 class="font-serif text-5xl tracking-[0.2em] font-semibold text-ivory-100 uppercase mb-4">Tejanjali</h1>
            <p class="text-sm uppercase tracking-widest text-terracotta-400 font-medium">Artist Studio</p>
        </div>
    </div>
    
    <!-- RIGHT: Login Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-espresso-900 relative">
        <!-- Mobile background fallback -->
        <div class="absolute inset-0 z-0 lg:hidden opacity-10">
            <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5LuMhSqFMv38dOKSC1-PbIiT8hRapuumBtBN_w6q5VNF-yjkcSPKj43GTwfimjmNkD2je6-0fyAoSKuwWsM-lYQoz4BXBuiaypZ5YUXlTrkGT9mijHJaX5ggr2juenwPTVY8x0wSeQC7zhKaQS55G1eDerDU_XuPIB7Khsuzsn99p-eCw5pqcixcWwF8xuA5IOyrFkyP3vgtyZJgzWO9fqVJlmzK_vhL0OE6lupPLejcbWuWvHp4J8GIZLbxVUEAjzQ8" alt="Tejanjali">
            <div class="absolute inset-0 bg-espresso-950/80"></div>
        </div>

        <div class="w-full max-w-md relative z-10 space-y-8">
            <div class="lg:hidden text-center mb-12">
                <h1 class="font-serif text-4xl tracking-[0.2em] font-semibold text-ivory-100 uppercase mb-2">Tejanjali</h1>
                <p class="text-xs uppercase tracking-widest text-terracotta-400 font-medium">Artist Studio</p>
            </div>
            
            <div>
                <h2 class="font-serif text-3xl font-medium text-ivory-100">Welcome back</h2>
                <p class="mt-2 text-sm text-ivory-muted">Sign in to manage your artist portfolio.</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div id="errorMsg" class="hidden text-rose-400 text-sm p-3 bg-rose-500/10 border border-rose-500/20 rounded"></div>
                
                <div>
                    <label for="email" class="block text-xs font-medium text-ivory-muted mb-1.5">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-md bg-espresso-800 border-espresso-600 px-3.5 py-2.5 text-ivory-100 shadow-sm focus:border-terracotta-500 focus:ring-terracotta-500 sm:text-sm">
                </div>

                <div>
                    <label for="password" class="block text-xs font-medium text-ivory-muted mb-1.5">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-md bg-espresso-800 border-espresso-600 px-3.5 py-2.5 text-ivory-100 shadow-sm focus:border-terracotta-500 focus:ring-terracotta-500 sm:text-sm">
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-espresso-600 bg-espresso-800 text-terracotta-500 focus:ring-terracotta-500">
                        <label for="remember-me" class="ml-2 block text-sm text-ivory-muted">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-terracotta-400 hover:text-terracotta-300">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="flex w-full justify-center rounded-md bg-terracotta-500 px-3 py-3 text-sm font-semibold text-white shadow-sm hover:bg-terracotta-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-terracotta-500 transition-colors uppercase tracking-wider">
                    Sign in
                </button>
            </form>
        </div>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = e.target.querySelector('button');
    const errorMsg = document.getElementById('errorMsg');
    
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errorMsg.classList.add('hidden');
    
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.token) {
            localStorage.setItem('adminToken', data.token);
            window.location.href = '/admin/index.html';
        } else {
            throw new Error(data.error || 'Login failed');
        }
    } catch(err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign in';
    }
});
</script>
</body>
</html>
